<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080f1a;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.bg{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;gap:10px;min-height:160px}
.bg img{width:80px;height:80px;object-fit:contain}
.label{font-family:'Raleway',sans-serif;font-size:8px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;text-align:center;opacity:.6}
</style></head><body>
<div class="bg" style="background:#0d1b2a;border:1px solid rgba(138,155,176,.15)">
  <img src="/assets/logo.png" alt="logo">
  <span class="label" style="color:#8a9bb0">On Navy — Primary</span>
</div>
<div class="bg" style="background:#080f1a;border:1px solid rgba(138,155,176,.1)">
  <img src="/assets/logo.png" alt="logo">
  <span class="label" style="color:#8a9bb0">On Deep Navy</span>
</div>
<div class="bg" style="background:#f5f0e8">
  <img src="/assets/logo.png" alt="logo">
  <span class="label" style="color:#243d5c">On Cream</span>
</div>
<div class="bg" style="background:#ffffff">
  <img src="/assets/logo.png" alt="logo">
  <span class="label" style="color:#243d5c">On White</span>
</div>
</body></html>
