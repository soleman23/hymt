<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@600;700&family=DM+Sans:opsz,wght@9..40,400@display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080f1a;font-family:'Raleway',sans-serif;padding:20px}
.row{display:flex;gap:3px;margin-bottom:3px}
.swatch{flex:1;display:flex;flex-direction:column}
.chip{height:52px}
.info{padding:8px 10px;background:#132234;border:1px solid rgba(138,155,176,.15);border-top:none}
.name{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#f5f0e8;display:block}
.hex{font-family:'DM Sans',sans-serif;font-size:10px;color:#8a9bb0;margin-top:1px;display:block}
.header{font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#C9A84C;margin-bottom:8px;margin-top:14px}
.header:first-child{margin-top:0}
</style></head><body>
<div class="header">Brand Primaries</div>
<div class="row">
  <div class="swatch"><div class="chip" style="background:#0d1b2a;border:1px solid rgba(138,155,176,.2)"></div><div class="info"><span class="name">Navy</span><span class="hex">#0d1b2a</span></div></div>
  <div class="swatch"><div class="chip" style="background:#080f1a;border:1px solid rgba(138,155,176,.2)"></div><div class="info"><span class="name">Navy Deep</span><span class="hex">#080f1a</span></div></div>
  <div class="swatch"><div class="chip" style="background:#1a2d45"></div><div class="info"><span class="name">Navy Elevated</span><span class="hex">#1a2d45</span></div></div>
  <div class="swatch"><div class="chip" style="background:#243d5c"></div><div class="info"><span class="name">Navy Mid</span><span class="hex">#243d5c</span></div></div>
  <div class="swatch"><div class="chip" style="background:#5e84ae"></div><div class="info"><span class="name">Navy Light</span><span class="hex">#5e84ae</span></div></div>
</div>
<div class="row">
  <div class="swatch"><div class="chip" style="background:#C9A84C"></div><div class="info"><span class="name">Gold — Primary</span><span class="hex">#C9A84C</span></div></div>
  <div class="swatch"><div class="chip" style="background:#d4b86a"></div><div class="info"><span class="name">Gold Light</span><span class="hex">#d4b86a</span></div></div>
  <div class="swatch"><div class="chip" style="background:#a8862e"></div><div class="info"><span class="name">Gold Deep</span><span class="hex">#a8862e</span></div></div>
  <div class="swatch"><div class="chip" style="background:#ecdba8"></div><div class="info"><span class="name">Gold Pale</span><span class="hex">#ecdba8</span></div></div>
  <div class="swatch"><div class="chip" style="background:#f7f0de;border:1px solid rgba(0,0,0,.08)"></div><div class="info" style="background:#1a2d45"><span class="name">Gold Cream</span><span class="hex">#f7f0de</span></div></div>
</div>
<div class="row">
  <div class="swatch"><div class="chip" style="background:#8a9bb0"></div><div class="info"><span class="name">Silver — Primary</span><span class="hex">#8a9bb0</span></div></div>
  <div class="swatch"><div class="chip" style="background:#a8b8c8"></div><div class="info"><span class="name">Silver Light</span><span class="hex">#a8b8c8</span></div></div>
  <div class="swatch"><div class="chip" style="background:#c4d0db"></div><div class="info"><span class="name">Silver Pale</span><span class="hex">#c4d0db</span></div></div>
  <div class="swatch"><div class="chip" style="background:#f5f0e8;border:1px solid rgba(0,0,0,.08)"></div><div class="info" style="background:#1a2d45"><span class="name">Cream</span><span class="hex">#f5f0e8</span></div></div>
  <div class="swatch"><div class="chip" style="background:#faf8f4;border:1px solid rgba(0,0,0,.08)"></div><div class="info" style="background:#1a2d45"><span class="name">Off-White</span><span class="hex">#faf8f4</span></div></div>
</div>
</body></html>
