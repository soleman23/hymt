<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0ece4;padding:32px;display:flex;align-items:center;justify-content:center;min-height:160px}
.sig{display:flex;gap:20px;align-items:flex-start}
.logo-wrap img{width:52px;height:52px;object-fit:contain}
.divider{width:1px;background:rgba(201,168,76,.4);align-self:stretch}
.info{}
.name{font-family:'Raleway',sans-serif;font-size:15px;font-weight:700;letter-spacing:.03em;color:#0d1b2a}
.title{font-family:'Raleway',sans-serif;font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:#a8862e;margin-top:2px}
.company{font-family:'Raleway',sans-serif;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#243d5c;margin-top:1px}
.contacts{margin-top:10px;display:flex;flex-direction:column;gap:2px}
.c-row{font-family:'DM Sans',sans-serif;font-size:11px;color:#5e84ae;display:flex;gap:5px}
.c-row span:first-child{font-weight:500;color:#2f5077}
.cta-wrap{margin-top:12px;padding-top:10px;border-top:1px solid rgba(201,168,76,.3)}
.cta{font-family:'Raleway',sans-serif;font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#a8862e;text-decoration:none}
</style></head><body>
<div class="sig">
  <div class="logo-wrap"><img src="/assets/logo.png" alt="Hit Your Mark Travel"></div>
  <div class="divider"></div>
  <div class="info">
    <div class="name">Mark Sole</div>
    <div class="title">Founder &amp; Travel Director</div>
    <div class="company">Hit Your Mark Travel</div>
    <div class="contacts">
      <div class="c-row"><span>P</span><span>(408) 568-1404</span></div>
      <div class="c-row"><span>E</span><span>mark@hymtravel.com</span></div>
      <div class="c-row"><span>W</span><span>hymtravel.com</span></div>
    </div>
    <div class="cta-wrap"><a href="#" class="cta">Plan Your Next Journey →</a></div>
  </div>
</div>
</body></html>
