<!--
  Hit Your Mark Travel - Mark Sole email signature (Gmail, sending as mark@hymtravel.com)

  Why this file exists (2026-09-08): the signature installed in Gmail showed a broken-image
  placeholder for the logo on the iPad Gmail app and on any computer other than the one it
  was built on. The cause was the logo's URL: a private Google Drive image
  (lh3.googleusercontent.com/d/<file id>), which only loads in a browser signed into that
  Drive account. Gmail's image proxy, the Gmail mobile apps and recipients' mail clients
  fetch anonymously and get nothing. Every image here is an absolute https URL on the
  production site, so it loads wherever the mail is read.

  Logo: https://www.hymtravel.com/assets/logo.png (256x256 PNG, the site header logo,
  shown at 88px so it stays sharp on retina screens).

  What is live in Gmail (2026-09-08): the account's two default signatures, "HYMT" (new
  mail) and "HYMT Reply" (replies and forwards), were edited in place, swapping the logo
  URL and the phone number and keeping Mark's original markup. This file is the reference
  layout for the next full rebuild. Three older signatures in the same account ("Mark 2",
  "Mark Sole", "Mark sole - with links") were unused and were deleted later the same day,
  so the account holds only the two defaults.

  INSTALL (Gmail on the web - this is where the mark@hymtravel.com alias lives)
    1. Open this file in Chrome or Edge.
    2. Click anywhere on the page, press Ctrl+A, then Ctrl+C.
    3. Gmail > gear icon > See all settings > General > Signature.
       Pick the signature used for mark@hymtravel.com (or Create new).
    4. Click inside the signature editor, select everything already in it (Ctrl+A),
       then paste (Ctrl+V).
    5. Under "Signature defaults", make sure this signature is chosen for
       mark@hymtravel.com, for both "For new emails use" and "On reply/forward use".
    6. Scroll to the bottom and click Save Changes.
    7. Send a test email to yourself and open it on the phone.

  Phone / iPad: the Gmail app reuses the web signature automatically as long as
  "Mobile Signature" is switched OFF (Gmail app > Settings > the account > Signature
  settings). Force-quit and reopen the app once after saving so it re-syncs.

  Keep every URL below absolute (https://...). Do not paste a logo file into the Gmail
  editor from disk; if you ever need to swap the image inside Gmail, use
  Insert image > Web Address (URL) and paste the logo URL above.
-->
