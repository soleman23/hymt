name: mcp-production-live
on:
  pull_request:
    branches: [main]
    paths:
      - 'agent-mcp/**'
      - 'tools/verify-mcp-live.mjs'
      - '.github/workflows/mcp-production-live.yml'
      - 'public/.well-known/**'
      - 'public/.htaccess'
      - 'dist/.htaccess'
  push:
    branches: [main]
  schedule:
    - cron: '23 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-production-live-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
      - name: Verify deployed MCP service (including production website after merge)
        run: node tools/verify-mcp-live.mjs --retry ${{ github.event_name == 'pull_request' && '' || '--site' }}
